services:
  mongo:
    image: mongo:latest
    container_name: mongo
    restart: unless-stopped

    ports:
      # - "127.0.0.1:27017:27017"
      - "27017:27017"

    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - /etc/localtime:/etc/localtime:ro

    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all

    mem_limit: 2g

    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"quit(db.adminCommand('ping').ok ? 0 : 1)\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mongo_data:
    name: mongo_data
  mongo_config:
    name: mongo_config