# 这个 Collector 负责从 Kafka 消费数据，然后写入 ClickHouse。
receivers:
  kafka/traces:
    brokers:
      - kafka:9092
    topic: otel-traces
    group_id: otel-clickhouse-traces
    # encoding: otlp_proto
    encoding: otlp_json

  kafka/metrics:
    brokers:
      - kafka:9092
    topic: otel-metrics
    group_id: otel-clickhouse-metrics
    encoding: otlp_proto

  kafka/logs:
    brokers:
      - kafka:9092
    topic: otel-logs
    group_id: otel-clickhouse-logs
    encoding: otlp_proto

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  batch:
    timeout: 5s
    send_batch_size: 2048

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s&compress=lz4
    database: otel
    username: default
    password: ""
    create_schema: true
    ttl: 168h

  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: info

  pipelines:
    traces:
      receivers:
        - kafka/traces
      processors:
        - memory_limiter
        - batch
      exporters:
        - clickhouse
        - debug

    metrics:
      receivers:
        - kafka/metrics
      processors:
        - memory_limiter
        - batch
      exporters:
        - clickhouse
        - debug

    logs:
      receivers:
        - kafka/logs
      processors:
        - memory_limiter
        - batch
      exporters:
        - clickhouse
        - debug