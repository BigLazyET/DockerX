# 这个 Collector 负责接收应用侧的 OTLP 数据，然后写入 Kafka。
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  batch:
    timeout: 5s
    send_batch_size: 2048

exporters:
  kafka/traces:
    brokers:
      - kafka:9092
    topic: otel-traces
    encoding: otlp_proto

  kafka/metrics:
    brokers:
      - kafka:9092
    topic: otel-metrics
    encoding: otlp_proto

  kafka/logs:
    brokers:
      - kafka:9092
    topic: otel-logs
    encoding: otlp_proto

  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888

  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - kafka/traces
        - debug

    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - kafka/metrics
        - debug

    logs:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - kafka/logs
        - debug