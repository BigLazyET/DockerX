# Grafana 通过 ClickHouse datasource 查询数据。
apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: true
    jsonData:
      server: clickhouse
      port: 9000
      protocol: native
      username: default
      defaultDatabase: otel
      tlsSkipVerify: true
    secureJsonData:
      password: ""